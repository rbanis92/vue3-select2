name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Release tag must match package version')"
          node -e "fetch('https://registry.npmjs.org/vue3-select2/'+require('./package.json').version).then(r=>{if(r.status!==404)throw Error('Version already exists or registry unavailable')}).catch(e=>{console.error(e);process.exit(1)})"
      - run: npm ci
      - run: npm run build:publish
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
